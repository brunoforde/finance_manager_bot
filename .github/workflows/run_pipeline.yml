name: Processar Extratos Financeiros

on:
  workflow_dispatch:
    inputs:
      tipo_processamento:
        description: 'O que você deseja processar?'
        required: true
        default: 'todos'
        type: choice
        options:
          - 'todos'
          - 'faturas_cartao'
          - 'extratos_bancarios'

jobs:
  extract-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Pipeline
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          DRIVE_INPUT_FOLDER_ID: ${{ secrets.DRIVE_INPUT_FOLDER_ID }}
          DRIVE_REPORT_OUTPUT_FOLDER_ID: ${{ secrets.DRIVE_REPORT_OUTPUT_FOLDER_ID }}
          DRIVE_PROCESSED_FOLDER_ID: ${{ secrets.DRIVE_PROCESSED_FOLDER_ID }}
          TIPO_PROCESSAMENTO: ${{ github.event.inputs.tipo_processamento }}
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          python -B main.py

      - name: Salvar Relatório no GitHub (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-financeiros
          path: temp_entrada/*.xlsx
          retention-days: 30