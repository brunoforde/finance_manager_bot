name: Processar Extratos Financeiros

on:
  workflow_dispatch:
    inputs:
      tipo_processamento:
        description: 'O que você deseja processar?'
        required: true
        default: 'todos'
        type: choice
        options:
          - 'todos'
          - 'faturas_cartao'
          - 'extratos_bancarios'

jobs:
  extract-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Pipeline
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DRIVE_INPUT_FOLDER_ID: ${{ secrets.DRIVE_INPUT_FOLDER_ID }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.DRIVE_OUTPUT_FOLDER_ID }}
          DRIVE_PROCESSED_FOLDER_ID: ${{ secrets.DRIVE_PROCESSED_FOLDER_ID }}
          TIPO_PROCESSAMENTO: ${{ github.event.inputs.tipo_processamento }}
        run: |
          python main.py